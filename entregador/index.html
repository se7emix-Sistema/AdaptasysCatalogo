<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- App do entregador: app separado do catálogo (outro ícone, outro nome, instala à parte) -->
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon-64.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Entregas"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{color-scheme:light;--bg:#F3F6FB;--card:#fff;--tx:#0F172A;--mu:#5B6474;--bd:#E2E8F0;--ac:#1E4FD8;--top:#0B1F4D;--ac2:#EAF0FF;--ok:#0E8A4F;--ok2:#E7F6EC;--okt:#0B6B3A;--wn:#8A4B00;--wn2:#FFF4E5;--rd:#C02A22;--rd2:#FDECEA;--pix:#0A5C86;--pix2:#EAF7FF}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0E131B;--card:#18202C;--tx:#EEF2F7;--mu:#9AA6B8;--bd:#2A3445;--ac2:#1C2A4A;--ok2:#12301F;--okt:#5FD394;--wn:#F2B661;--wn2:#33260F;--rd2:#3A1A18;--pix:#7CCBF2;--pix2:#102B3A}}
[hidden]{display:none!important}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--top);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;flex-direction:column;gap:12px}
.hrow{display:flex;align-items:center;gap:12px}.av{width:42px;height:42px;border-radius:12px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}
.hn{flex:1;min-width:0}.hn b{display:block;font-size:17px}.hn small{display:block;font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.disp{display:flex;align-items:center;justify-content:space-between;min-height:50px;padding:0 16px;border-radius:14px;border:0;background:var(--ok);color:#fff;font-weight:700;font-size:16px;font-family:inherit;cursor:pointer}
.disp i{width:12px;height:12px;border-radius:6px;background:#B7F5D2;display:inline-block;margin-right:10px}.disp small{font-weight:600;opacity:.85;font-size:13px}
.disp.off{background:rgba(255,255,255,.12)}.disp.off i{background:#9AA6B8}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stats div{background:rgba(255,255,255,.09);border-radius:12px;padding:8px 10px}.stats small{display:block;font-size:12px;opacity:.75}.stats b{font-size:17px}
main{padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
h1.tt{font-size:20px;font-weight:800;margin:4px 0 10px;display:flex;justify-content:space-between;align-items:baseline}h1.tt small{font-size:13px;font-weight:500;color:var(--mu)}
.card{background:var(--card);border-radius:18px;padding:16px;margin:0 0 12px;box-shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.sub{font-size:13px;color:var(--mu);font-weight:600}.addr{display:block;font-size:19px;font-weight:800;line-height:1.25}.mu{color:var(--mu)}
.pill{flex:none;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;background:var(--ac2);color:var(--ac)}.pill.ok{background:var(--ok2);color:var(--okt)}.pill.wn{background:var(--wn2);color:var(--wn)}
.cob{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:12px;padding:10px 12px;background:var(--wn2);color:var(--wn)}.cob b{font-size:20px;white-space:nowrap}.cob span{font-weight:700}.cob small{display:block;font-weight:600;font-size:13px}
.cob.pix{background:var(--pix2);color:var(--pix)}.cob.cart{background:var(--ac2);color:var(--ac)}
.okl{font-size:13px;font-weight:600;color:var(--okt);display:flex;gap:6px;align-items:center}.ref{background:var(--wn2);color:var(--wn);border-radius:10px;padding:8px 10px;font-weight:600;font-size:14.5px}
.b{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-weight:800;font-size:17px;font-family:inherit;text-decoration:none;cursor:pointer;padding:0 14px}
.b.s{background:var(--card);color:var(--tx);border:1.5px solid var(--bd);font-weight:700;font-size:15px}.b.ok{background:var(--ok)}.b.w{width:100%}.b[disabled]{opacity:.5}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.acts a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:62px;border-radius:14px;text-decoration:none;font-weight:700;font-size:13px;background:var(--ac2);color:var(--ac)}.acts a.p{background:var(--ac);color:#fff}.acts a.g{background:var(--ok2);color:var(--okt)}
.stop{display:flex;gap:12px;align-items:center}.num{flex:none;width:34px;height:34px;border-radius:17px;background:var(--ac);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}.num.c{background:var(--wn2);color:var(--wn)}
.card.dest{border:2px solid var(--ac)}.lk{background:none;border:0;color:var(--mu);font-weight:600;font-size:14px;font-family:inherit;text-decoration:underline;cursor:pointer;padding:6px;align-self:center}
details summary{cursor:pointer;color:var(--ac);font-weight:700}ul{margin:6px 0;padding-left:20px}
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 12px}.res>div{background:var(--card);border-radius:16px;padding:12px 14px}.res small{display:block;color:var(--mu);font-size:13px;font-weight:600}.res b{font-size:24px}
.mao{background:var(--wn2);color:var(--wn);border-radius:18px;padding:14px 16px;margin:0 0 12px}.mao b{display:block;font-size:28px}
.lin{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.lin:last-child{border:0}
.vazio{text-align:center;padding:40px 10px;color:var(--mu)}.vazio svg{margin:0 auto 8px;display:block;opacity:.6}
input{font:inherit;width:100%;padding:14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);margin:6px 0;text-align:center;font-size:24px;letter-spacing:.15em;text-transform:uppercase}
.err{color:var(--rd);font-weight:700;min-height:22px}
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
nav.bn button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;border:0;background:none;color:var(--mu);font-weight:600;font-size:12.5px;font-family:inherit;cursor:pointer}nav.bn button.on{color:var(--ac);font-weight:800}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}.ov .card{width:100%;max-width:640px;border-radius:20px 20px 0 0;margin:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.full{position:fixed;inset:0;z-index:45;background:var(--top);color:#fff;display:flex;flex-direction:column;gap:16px;padding:calc(28px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto}
.full .ring{width:96px;height:96px;border-radius:48px;background:var(--ac);display:flex;align-items:center;justify-content:center;margin:24px auto 8px;box-shadow:0 0 0 14px rgba(255,255,255,.12),0 0 0 30px rgba(255,255,255,.06)}
.full h2{margin:10px 0 0;font-size:27px;text-align:center}.full .card{color:var(--tx)}
.inst{display:flex;gap:12px;align-items:center;background:var(--ac2);border:1.5px solid var(--ac);border-radius:16px;padding:12px 14px;margin:10px 0}.inst img{width:48px;height:48px;border-radius:12px;flex:none}.inst div{flex:1;font-size:14.5px}.inst .t{display:block;font-size:16px;font-weight:800}.inst .b{min-height:42px;font-size:14.5px}
.alm{position:fixed;left:0;right:0;top:0;z-index:40;color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;font-weight:800;font-size:17px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.ck{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:16px}.ck input{width:22px;height:22px;margin:2px 0 0;flex:none}
.bts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.din{background:var(--wn2);color:var(--wn);border-radius:12px;padding:10px 12px;font-weight:700;font-size:17px}.din.pix{background:var(--pix2);color:var(--pix)}.din.cart{background:var(--ac2);color:var(--ac)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#17202E;color:#fff;border-radius:12px;padding:12px 14px;font-weight:700;z-index:30;text-align:center}
</style></head><body>
<header><div class="hrow"><div class="av" id="hav">AS</div><div class="hn"><b id="hn">Entregas</b><small id="hs">AdaptaSys Entregador</small></div>
<button class="ib" onclick="avisosM()" aria-label="Avisos"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
<button class="ib" onclick="carregar(true)" aria-label="Atualizar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button></div>
<button class="disp" id="disp" hidden onclick="pausa()"></button><div class="stats" id="stats" hidden></div></header>
<div id="inst" style="max-width:640px;margin:0 auto;padding:0 16px"></div>
<main id="m"><div class="vazio"><p>Carregando…</p></div></main>
<nav class="bn" id="bn" hidden aria-label="Menu"><button id="n1" class="on" onclick="aba='fila';desenhar()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h12"/></svg><span id="n1t">Para entregar</span></button>
<button id="n2" onclick="aba='comigo';desenhar()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="6" r="3"/><path d="M9 18h5a4 4 0 0 0 0-8h-4a4 4 0 0 1 0-8h5"/></svg><span id="n2t">Comigo</span></button>
<button id="n3" onclick="aba='hoje';desenhar()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg><span>Hoje</span></button></nav>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=v=>'R$ '+(+v||0).toFixed(2).replace('.',','),dig=v=>String(v||'').replace(/\D/g,'');
const MO=window.MO_CFG||{},sb=(window.supabase&&String(MO.sbUrl||'').startsWith('http'))?window.supabase.createClient(MO.sbUrl,MO.sbKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'mo-entregador'}}):null;
let EU=null,L=[],G=null,aba='fila',POS=null,PAUSA=false,vistos=new Set(),primeira=true,MEUS=new Map(),PRONTOS=new Set(),PEGUEI=new Set();
const toast=t=>{const b=document.createElement('div');b.className='toast';b.textContent=t;document.body.appendChild(b);setTimeout(()=>b.remove(),3500)};
/* ===== AVISOS SONOROS: toca e repete até o entregador tocar em "Vi" (com vibração e notificação) ===== */
let SOM=true,AC=null,ALM=null,FILA_ALM=[],WL=null;try{SOM=localStorage.getItem('mo-ent-som')!='0'}catch(e){}
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();return AC}
document.addEventListener('pointerdown',()=>{try{ac();const b=$('#somoff');if(b&&AC.state=='running')b.remove()}catch(e){}},true);
const SONS={novo:[[880,0,.18],[1175,.2,.18],[1568,.4,.32]],meu:[[660,0,.2],[990,.24,.2],[660,.48,.2],[990,.72,.34]],pronto:[[1047,0,.16],[1319,.2,.28]],canc:[[523,0,.3],[392,.36,.3],[262,.72,.5]]};
function tom(t){if(!SOM)return;try{const c=ac();(SONS[t]||SONS.novo).forEach(([f,d,l])=>{const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.0001,c.currentTime+d);g.gain.exponentialRampToValueAtTime(.35,c.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d+l);o.connect(g);g.connect(c.destination);o.start(c.currentTime+d);o.stop(c.currentTime+d+l+.02)})}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(t=='canc'?[600,200,600]:[250,120,250,120,400])}catch(e){}}
function bip(){tom('novo')}
async function notif(txt){try{if(!('Notification' in window)||Notification.permission!='granted')return;const r=await navigator.serviceWorker.getRegistration();if(r)r.showNotification('AdaptaSys Entregador',{body:txt,icon:'icon-192.png',badge:'icon-192.png',tag:'ent-aviso',renotify:true,vibrate:[300,120,300]})}catch(e){}}
/* tipo: novo | meu | pronto | canc  — repete a cada 6 s até tocar em "Vi" (cancelado toca 3 vezes) */
function aviso(tipo,txt){
  FILA_ALM.push({tipo,txt});tom(tipo);if(document.hidden)notif(txt);
  let n=0;clearInterval(ALM);ALM=setInterval(()=>{n++;const u=FILA_ALM[FILA_ALM.length-1];if(!u||(u.tipo=='canc'&&n>=3)){clearInterval(ALM);ALM=null;return}tom(u.tipo);if(document.hidden&&n%5==0)notif(u.txt)},6000);
  let a=$('#alm');if(!a){a=document.createElement('div');a.id='alm';a.className='alm';document.body.appendChild(a)}
  const cor={novo:'var(--ac)',meu:'#7B2FD0',pronto:'#0E8A4F',canc:'#C02A22'}[tipo];a.style.background=cor;
  a.innerHTML=`<span>${FILA_ALM.map(x=>esc(x.txt)).slice(-3).join('<br>')}</span><button class="b s" style="min-height:44px;flex:none" onclick="calar()">Vi</button>`;
}
function calar(){clearInterval(ALM);ALM=null;FILA_ALM=[];const a=$('#alm');if(a)a.remove();const f=$('#full');if(f)f.remove()}
async function telaLigada(on){try{localStorage.setItem('mo-ent-tela',on?'1':'0')}catch(e){}
  try{if(on&&'wakeLock' in navigator){WL=await navigator.wakeLock.request('screen');toast('🔆 A tela fica ligada enquanto o app estiver aberto.')}else if(WL){await WL.release();WL=null}}catch(e){toast('Este celular não deixa manter a tela ligada.')}}
document.addEventListener('visibilitychange',()=>{try{if(!document.hidden&&localStorage.getItem('mo-ent-tela')=='1'&&!WL)telaLigada(true)}catch(e){}});
function avisosM(){
  const ov=document.createElement('div');ov.className='ov';ov.onclick=e=>{if(e.target==ov)ov.remove()};
  const tl=(()=>{try{return localStorage.getItem('mo-ent-tela')=='1'}catch(e){return false}})(),np='Notification' in window?Notification.permission:'x';
  ov.innerHTML=`<div class="card"><h2 style="margin:0 0 10px">🔔 Avisos</h2>
   <label class="ck"><input type="checkbox" ${SOM?'checked':''} onchange="SOM=this.checked;try{localStorage.setItem('mo-ent-som',SOM?'1':'0')}catch(e){};if(SOM)tom('novo')"><span><b>Som e vibração</b> quando chegar pedido</span></label>
   <label class="ck"><input type="checkbox" ${tl?'checked':''} onchange="telaLigada(this.checked)"><span><b>Manter a tela ligada</b><br><small class="mu">Recomendado na rua: com a tela apagada o celular pode atrasar os avisos.</small></span></label>
   ${np=='default'?`<button class="b s w" style="margin:6px 0" onclick="Notification.requestPermission().then(()=>{this.closest('.ov').remove();avisosM()})">Permitir notificações</button>`:np=='denied'?'<p class="mu">As notificações estão bloqueadas no navegador (Configurações do site).</p>':''}
   <div class="bts" style="margin-top:10px"><button class="b s" onclick="tom('novo')">▶ Testar som</button><button class="b" onclick="this.closest('.ov').remove()">Fechar</button></div></div>`;
  document.body.appendChild(ov);
}
async function sessao(){
  let {data}=await sb.auth.getSession();if(data&&data.session)return data.session;
  const r=await sb.auth.signInAnonymously();if(r.error)throw new Error(/anonymous/i.test(r.error.message)?'A loja precisa ligar "Allow anonymous sign-ins" no Supabase.':r.error.message);return r.data.session;
}
function telaCodigo(msg){
  $('#bn').hidden=true;$('#disp').hidden=true;$('#stats').hidden=true;
  $('#m').innerHTML=`<div class="card" style="margin-top:20px"><h2 style="margin:0 0 6px">🏍️ Entrar como entregador</h2><p class="mu">Peça o código na loja (Gestão › Entregadores) ou escaneie o QR Code que aparece lá.</p>
  <input id="cod" maxlength="9" placeholder="XXXX-XXXX" autocomplete="one-time-code" onkeydown="if(event.key=='Enter')parear()"><div class="err" id="er">${esc(msg||'')}</div>
  <button class="b w" style="width:100%" onclick="parear()">Entrar</button></div>`;
}
async function parear(c){
  c=c||($('#cod')?$('#cod').value:'');
  try{const r=await sb.rpc('entregador_parear',{p_codigo:c});if(r.error)throw r.error;history.replaceState(null,'',location.pathname);toast('Pronto! Este celular agora recebe as entregas.');await iniciar()}
  catch(e){telaCodigo(e.message||String(e))}
}
async function iniciar(){
  if(!sb){$('#m').innerHTML='<div class="card">O site ainda não foi configurado (config.js).</div>';return}
  try{await sessao()}catch(e){$('#m').innerHTML='<div class="card err">'+esc(e.message)+'</div>';return}
  const h=(location.hash.match(/c=([A-Za-z0-9-]+)/)||[])[1];if(h)return parear(h);
  const r=await sb.rpc('entregador_eu');EU=r.data;
  if(!EU)return telaCodigo();
  $('#hn').textContent='Olá, '+EU.nome.split(' ')[0];$('#hs').textContent=EU.loja||'Entregas';$('#hav').textContent=iniciais(EU.nome);document.title='Entregas · '+(EU.loja||'');$('#bn').hidden=false;$('#disp').hidden=false;$('#stats').hidden=false;cores();gps();
  await carregar();
}
async function carregar(manual){
  if(!EU)return;
  const r=await sb.rpc('entregador_pedidos');
  if(r.error){if(/ENTREGADOR/.test(r.error.message)){EU=null;return telaCodigo('Este celular foi desconectado pela loja. Peça um código novo.')}if(manual)toast('Sem internet agora.');return}
  L=r.data||[];if(manual||!cores.t||Date.now()-cores.t>600000){cores.t=Date.now();cores()}
  try{const g=await sb.rpc('entregador_resumo');if(!g.error)G=g.data}catch(e){}
  const novos=L.filter(o=>o.st=='conf'&&!o.rota&&!vistos.has(o.id));L.forEach(o=>vistos.add(o.id));
  const meusAgora=new Map(L.filter(o=>o.rota&&o.rota.id==EU.id&&!o.entregue&&o.st!='canc').map(o=>[o.id,o]));
  const prontos=[];meusAgora.forEach(o=>Object.entries(o.parts||{}).forEach(([k,p])=>{const ch=o.id+'|'+k;if(p.entrega!='parceiro'&&p.st=='pronto'&&!p.col&&!PRONTOS.has(ch)){PRONTOS.add(ch);prontos.push(p.nome)}}));
  if(!primeira){
    if(novos.length&&!PAUSA){aviso('novo','🔔 '+(novos.length==1?'Pedido novo para entregar'+(novos[0].bairro?' · '+novos[0].bairro:''):novos.length+' pedidos novos para entregar'));if(novos.length==1)alertaTela(novos[0])}
    meusAgora.forEach((o,id)=>{if(!MEUS.has(id)&&!PEGUEI.has(id))aviso('meu','🛵 A loja passou para você: '+(o.cn||'pedido'))});
    prontos.forEach(n=>aviso('pronto','📦 Pronto para buscar em '+n));
    MEUS.forEach((o,id)=>{if(!meusAgora.has(id)){const x=L.find(y=>y.id==id);if(!x||x.st=='canc'||(x.rota&&x.rota.id!=EU.id))aviso('canc','❌ '+(x&&x.st=='canc'?'Cancelado':'Saiu da sua lista')+': pedido de '+(o.cn||''))}});
  }
  MEUS=meusAgora;primeira=false;desenhar();
}

async function rotaTodas(){

  const eu=await new Promise(ok=>{if(!navigator.geolocation)return ok(null);navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude}),()=>ok(null),{enableHighAccuracy:true,timeout:6000,maximumAge:60000})});
  let pend=meus.map(o=>({o,st:paradas(o)})).filter(x=>x.st.length),seq=[],cur=eu,semLoc=meus.length-pend.length;
  const d=(a,b)=>!a?0:Math.hypot((a.lat-b.lat)*110540,(a.lng-b.lng)*111320*Math.cos(b.lat*Math.PI/180));
  while(pend.length){let bi=0,bd=1e12;pend.forEach((x,i)=>{const dd=d(cur,x.st[0]);if(dd<bd){bd=dd;bi=i}});const x=pend[bi];seq.push(x.st.shift());cur=seq[seq.length-1];if(!x.st.length)pend.splice(bi,1)}
  if(!seq.length)return toast('Nenhuma das suas entregas tem localização no mapa.');
  if(seq.length>10){toast('Muitas paradas: a rota abre com as 10 primeiras.');seq=seq.slice(0,10)}

  <div class="bts"><button class="b s" onclick="this.closest('.ov').remove()">Voltar</button><button class="b ok" id="eok">✅ Sim, entregue</button></div></div>`;
  document.body.appendChild(ov);
  $('#eok').onclick=async()=>{$('#eok').disabled=true;
    const loc=await new Promise(ok=>{if(!navigator.geolocation)return ok(null);navigator.geolocation.getCurrentPosition(p=>ok({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),()=>ok(null),{enableHighAccuracy:true,timeout:6000,maximumAge:30000})});
    const r=await sb.rpc('entregador_entregue',{p_id:id,p_loc:loc});ov.remove();
    if(r.error)return toast(r.error.message);toast('✅ Entrega registrada. A loja e o cliente já sabem.');carregar()};
}
setInterval(()=>carregar(),document.hidden?60000:15000);
/* o navegador só libera som depois de um toque na tela: mostra um aviso até a pessoa tocar */
setTimeout(()=>{try{if(SOM&&(!AC||AC.state!='running')&&!$('#somoff')){const b=document.createElement('button');b.id='somoff';b.className='b w';b.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;width:auto;min-height:52px;font-size:17px';b.textContent='🔔 Toque aqui para ligar o som dos avisos';b.onclick=()=>{ac();tom('pronto');b.remove()};document.body.appendChild(b)}}catch(e){}},2500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)carregar()});
addEventListener('hashchange',()=>{const h=(location.hash.match(/c=([A-Za-z0-9-]+)/)||[])[1];if(h)parear(h)});
iniciar();

/* ===== instalar como app separado ===== */
const soloApp=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let pedidoInst=null;
/* aberto pelo próprio app de Entregas instalado? (o ícone abre com ?pwa=1) */
let proprio=false;try{proprio=new URLSearchParams(location.search).has('pwa')||sessionStorage.getItem('mo-ent-pwa')=='1';if(proprio)sessionStorage.setItem('mo-ent-pwa','1')}catch(x){}
const intentChrome=()=>'intent://'+location.host+location.pathname+location.hash+'#Intent;scheme=https;package=com.android.chrome;end';
function instDesenha(){
  const e=$('#inst');if(!e)return;
  if(soloApp()&&!proprio&&/android/i.test(navigator.userAgent)){
    // abriu dentro da janela de outro app instalado (ex.: o app de compras): manda para o Chrome, onde dá para instalar o de Entregas separado
    e.innerHTML=`<div class="inst"><img src="icon-192.png" alt=""><div><span class="t">Abriu dentro do app de compras?</span>Toque em <b>Abrir no Chrome</b> e depois em <b>Instalar</b>. O app de Entregas fica com ícone próprio, separado.</div><a class="b" href="${intentChrome()}">Abrir no Chrome</a></div>`;return}
  if(soloApp()){e.innerHTML='';return}
  let fechado=false;try{fechado=localStorage.getItem('mo-ent-inst')==String(new Date().toDateString())}catch(x){}if(fechado){e.innerHTML='';return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  e.innerHTML=`<div class="inst"><img src="icon-192.png" alt=""><div><span class="t">Instale o app de Entregas</span>${pedidoInst?'Fica com ícone próprio na tela do celular, separado do app de compras.':ios?'No Safari: toque em <b>Compartilhar</b> (□↑) e depois em <b>Adicionar à Tela de Início</b>.':'No menu do navegador (⋮), toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.'}</div>${pedidoInst?'<button class="b" onclick="instalar()">Instalar</button>':''}<button class="b s" style="min-height:42px;padding:0 10px" aria-label="Fechar" onclick="try{localStorage.setItem(\'mo-ent-inst\',new Date().toDateString())}catch(x){};instDesenha()">✕</button></div>`;
}
async function instalar(){if(!pedidoInst)return;pedidoInst.prompt();const r=await pedidoInst.userChoice.catch(()=>({}));pedidoInst=null;if(r.outcome=='accepted')toast('App de Entregas instalado!');instDesenha()}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();pedidoInst=e;instDesenha()});
addEventListener('appinstalled',()=>{pedidoInst=null;instDesenha()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});
instDesenha();
</script></body></html>
