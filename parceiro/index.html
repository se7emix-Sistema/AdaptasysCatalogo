<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B8F5A"><title>Parceiro</title>
<!-- App do PARCEIRO: recebe a parte dos pedidos com produtos dele. App separado (outro ícone e nome). -->
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon-64.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Parceiro"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{color-scheme:light;--bg:#F2F4F8;--card:#fff;--tx:#17202E;--mu:#5F6B7D;--bd:#DFE4EC;--ac:#0B8F5A;--ac2:#E3F5EC;--ok:#178A4E;--ok2:#E3F5EB;--wn:#A15C00;--wn2:#FFF3DF;--rd:#C02A22;--rd2:#FDECEA}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#10141B;--card:#1A202B;--tx:#EEF1F6;--mu:#9AA5B6;--bd:#2C3442;--ac:#3DD68C;--ac2:#14301F;--ok:#4CC383;--ok2:#163024;--wn:#F0B35A;--wn2:#33270F;--rd:#FF7A70;--rd2:#3A1A18}}
[hidden]{display:none!important}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--ac);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px}
header b{font-size:18px}header small{display:block;opacity:.85}header .sp{flex:1}
.tabs{display:flex;gap:8px;padding:10px 16px 0;position:sticky;top:58px;background:var(--bg);z-index:4}
.tabs button{flex:1;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 4px;font:700 14.5px inherit;font-family:inherit}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{padding:10px 16px 90px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.nm{font-size:19px;font-weight:800}.mu{color:var(--mu)}
.tag{display:inline-block;border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:800}.tag.ok{background:var(--ok2);color:var(--ok)}.tag.wn{background:var(--wn2);color:var(--wn)}.tag.ac{background:var(--ac2);color:var(--ac)}
.end{font-size:17px;font-weight:700;margin:8px 0 2px}.ref{background:var(--wn2);color:var(--wn);border-radius:10px;padding:8px 10px;margin:8px 0;font-weight:600}
.din{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:17px;font-weight:700;background:var(--ok2);color:var(--ok)}.din small{display:block;font-weight:600;font-size:14px}
.din.cart{background:var(--ac2);color:var(--ac)}.din.pix{background:var(--wn2);color:var(--wn)}
.bts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.b{display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:800 16px inherit;font-family:inherit;text-decoration:none;cursor:pointer;padding:0 12px}
.b.s{background:var(--card);color:var(--tx);border:1.5px solid var(--bd)}.b.ok{background:var(--ok)}.b.w{grid-column:1/-1}.b[disabled]{opacity:.5}
details{margin-top:8px}summary{cursor:pointer;color:var(--ac);font-weight:700}ul{margin:6px 0;padding-left:20px}
.res{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.res>div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}.res b{display:block;font-size:20px}.res small{color:var(--mu);font-size:12.5px}
.res .sal{background:var(--ok2);border-color:transparent}.res .sal b{color:var(--ok)}
.lin{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.lin:last-child{border:0}
.vazio{text-align:center;padding:40px 10px}.vazio div{font-size:50px}
input{font:inherit;width:100%;padding:14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);margin:6px 0;text-align:center;font-size:24px;letter-spacing:.15em;text-transform:uppercase}
.err{color:var(--rd);font-weight:700;min-height:22px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}.ov .card{width:100%;max-width:640px;border-radius:20px 20px 0 0;margin:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.inst{display:flex;gap:12px;align-items:center;background:var(--ac2);border:1.5px solid var(--ac);border-radius:16px;padding:12px 14px;margin:10px 0}.inst img{width:48px;height:48px;border-radius:12px;flex:none}.inst div{flex:1;font-size:14.5px}.inst .t{display:block;font-size:16px;font-weight:800}.inst .b{min-height:42px;font-size:14.5px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#17202E;color:#fff;border-radius:12px;padding:12px 14px;font-weight:700;z-index:30;text-align:center}
.its{margin:8px 0;padding:0;list-style:none}.its li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--bd);font-size:17px}.its li b{font-size:18px}
.nota{display:flex;gap:8px;margin-top:8px}.nota input{font-size:16px;letter-spacing:0;text-transform:none;text-align:left;padding:10px;margin:0}
.alarme{position:fixed;left:0;right:0;top:0;z-index:40;background:#C02A22;color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;font-weight:800;display:flex;gap:10px;align-items:center;justify-content:space-between}
</style></head><body>
<header><div><b id="hn">Parceiro</b><small id="hs">Pedidos da loja</small></div><div class="sp"></div><button class="b s" style="min-height:40px;font-size:14px" onclick="carregar(true)">↻ Atualizar</button></header>
<div class="tabs" id="tabs" hidden><button id="t1" class="on" onclick="aba='fila';desenhar()">Pedidos</button><button id="t2" onclick="aba='feitos';desenhar()">Concluídos</button><button id="t3" onclick="aba='rep';desenhar()">💰 Repasses</button></div>
<div id="inst" style="max-width:640px;margin:0 auto;padding:0 16px"></div>
<main id="m"><div class="vazio"><div>🤝</div><p class="mu">Carregando…</p></div></main>
<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=v=>'R$ '+(+v||0).toFixed(2).replace('.',','),dig=v=>String(v||'').replace(/\D/g,''),hm=d=>d?new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
const MO=window.MO_CFG||{},sb=(window.supabase&&String(MO.sbUrl||'').startsWith('http'))?window.supabase.createClient(MO.sbUrl,MO.sbKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'mo-parceiro'}}):null;
let EU=null,L=[],G=null,aba='fila',vistos=new Set(),primeira=true,alarme=null;
const toast=t=>{const b=document.createElement('div');b.className='toast';b.textContent=t;document.body.appendChild(b);setTimeout(()=>b.remove(),3500)};
/* toque de pedido novo: repete até alguém tocar em "Vi o pedido" */
function bip(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.22,.44].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=[880,1175,1568][i];g.gain.setValueAtTime(.3,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.2);o.connect(g).connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.22)});if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}
function tocar(n){if(alarme)return;bip();alarme=setInterval(bip,6000);const a=document.createElement('div');a.className='alarme';a.id='alm';a.innerHTML=`<span>🔔 ${n} pedido(s) novo(s) da loja</span><button class="b s" style="min-height:40px" onclick="calar()">Vi o pedido</button>`;document.body.appendChild(a)}
function calar(){clearInterval(alarme);alarme=null;const a=$('#alm');if(a)a.remove()}
async function sessao(){
  let {data}=await sb.auth.getSession();if(data&&data.session)return data.session;
  const r=await sb.auth.signInAnonymously();if(r.error)throw new Error(/anonymous/i.test(r.error.message)?'A loja precisa ligar "Allow anonymous sign-ins" no Supabase.':r.error.message);return r.data.session;
}
function telaCodigo(msg){
  $('#tabs').hidden=true;
  $('#m').innerHTML=`<div class="card" style="margin-top:20px"><h2 style="margin:0 0 6px">🤝 Entrar como parceiro</h2><p class="mu">Peça o código para a loja (Configurações › Parceiros) ou escaneie o QR Code que ela mostrar.</p>
  <input id="cod" maxlength="9" placeholder="XXXX-XXXX" autocomplete="one-time-code" onkeydown="if(event.key=='Enter')parear()"><div class="err" id="er">${esc(msg||'')}</div>
  <button class="b w" style="width:100%" onclick="parear()">Entrar</button></div>`;
}
async function parear(c){
  c=c||($('#cod')?$('#cod').value:'');
  try{const r=await sb.rpc('parceiro_parear',{p_codigo:c});if(r.error)throw r.error;history.replaceState(null,'',location.pathname);toast('Pronto! Este celular agora recebe os pedidos da loja.');await iniciar()}
  catch(e){telaCodigo(e.message||String(e))}
}
async function iniciar(){
  if(!sb){$('#m').innerHTML='<div class="card">O site ainda não foi configurado (config.js).</div>';return}
  try{await sessao()}catch(e){$('#m').innerHTML='<div class="card err">'+esc(e.message)+'</div>';return}
  const h=(location.hash.match(/c=([A-Za-z0-9-]+)/)||[])[1];if(h)return parear(h);
  const r=await sb.rpc('parceiro_eu');EU=r.data;
  if(!EU)return telaCodigo();
  $('#hn').textContent=EU.nome;$('#hs').textContent='Pedidos de '+(EU.loja||'a loja');document.title='Parceiro · '+EU.nome;$('#tabs').hidden=false;
  await carregar();
}
async function carregar(manual){
  if(!EU)return;
  const r=await sb.rpc('parceiro_pedidos');
  if(r.error){if(/PARCEIRO/.test(r.error.message)){EU=null;return telaCodigo('Este celular foi desconectado pela loja. Peça um código novo.')}if(manual)toast('Sem internet agora.');return}
  L=r.data||[];
  try{const g=await sb.rpc('parceiro_resumo',{p_dias:31});if(!g.error)G=g.data}catch(e){}
  const novos=L.filter(o=>o.st=='conf'&&(!o.parte||!o.parte.st||o.parte.st=='novo')&&!vistos.has(o.id));novos.forEach(o=>vistos.add(o.id));
  if(novos.length)tocar(novos.length);
  primeira=false;desenhar();
}
const ST={novo:['wn','Novo pedido'],aceito:['wn','Separando'],pronto:['ok','Pronto para buscar'],saiu:['ac','Saiu para entregar'],entregue:['ok','Entregue'],falta:['wn','Avisou falta']};
function card(o){
  const p=o.parte||{},st=ST[p.st||'novo']||ST.novo,busca=(p.entrega||EU.entrega)!='parceiro',c=o.cliente,tel=c&&dig(c.ph),l=c&&c.loc&&isFinite(c.loc.lat)?c.loc:null;
  const andamento=o.st=='conf',canc=o.st=='canc';
  let bts='';
  if(andamento){
    if(!p.st||p.st=='novo')bts=`<button class="b ok w" onclick="marcar('${o.id}','aceito')">👍 Aceitar e separar</button>`;
    else if(p.st=='aceito'||p.st=='falta')bts=busca?`<button class="b ok w" onclick="marcar('${o.id}','pronto')">📦 Pronto para o entregador buscar</button>`:`<button class="b ok w" onclick="marcar('${o.id}','saiu')">🛵 Saiu para entregar</button>`;
    else if(p.st=='saiu')bts=`<button class="b ok w" onclick="marcar('${o.id}','entregue')">✅ Entreguei ao cliente</button>`;
    if(p.st!='entregue'&&p.st!='pronto'&&p.st!='saiu')bts+=`<button class="b s w" onclick="falta('${o.id}')">⚠️ Falta algum produto</button>`;
  }
  return `<div class="card" ${canc?'style="opacity:.6"':''}><div class="top"><div><div class="nm">Pedido #${esc(String(o.id).slice(-4).toUpperCase())}</div><span class="mu">${new Date(o.date).toLocaleDateString('pt-BR')} ${hm(o.date)} · ${busca?'o entregador da loja busca':'você entrega'}</span></div>
   ${canc?'<span class="tag" style="background:var(--rd2);color:var(--rd)">Cancelado pela loja</span>':o.st=='ent'?'<span class="tag ok">✓ Concluído</span>':`<span class="tag ${st[0]}">${st[1]}</span>`}</div>
   <ul class="its">${(o.items||[]).map(i=>`<li><span><b>${esc(i.q)} ${esc(i.u||'un')}</b> · ${esc(i.n)}</span><span class="mu">${R(i.p*i.q)}</span></li>`).join('')}</ul>
   <div style="display:flex;justify-content:space-between;font-weight:800;font-size:17px"><span>Total dos seus produtos</span><span>${R(o.valor)}</span></div>
   ${o.obs?`<div class="ref">📝 Obs. do cliente: ${esc(o.obs)}</div>`:''}${p.obs?`<div class="ref">⚠️ ${esc(p.obs)}</div>`:''}
   ${busca&&o.rota?`<p class="mu" style="margin:6px 0 0">🛵 Entregador: <b>${esc(o.rota)}</b></p>`:''}${p.col?`<p style="margin:6px 0 0;color:var(--ok);font-weight:700">✓ Coletado por ${esc(p.col.por)} às ${hm(p.col.date)}</p>`:''}
   ${c?`<div class="card" style="margin:10px 0;background:var(--bg)"><b>👤 ${esc(c.cn||'Cliente')}</b><div class="end" style="font-size:16px">📍 ${esc(c.addr||'')}</div>${c.bairro?`<div class="mu">Bairro ${esc(c.bairro)}</div>`:''}${c.ref?`<div class="ref">🏠 ${esc(c.ref)}</div>`:''}
     <div class="bts">${l?`<a class="b s" href="https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}&travelmode=driving" target="_blank" rel="noopener">🗺️ Rota</a>`:''}${tel?`<a class="b s" href="tel:${tel}">📞 Ligar</a>`:''}</div></div>`:''}
   <div class="nota"><input id="nf-${o.id}" placeholder="Nº da sua nota fiscal" value="${esc(p.nota||'')}"><button class="b s" style="min-height:44px" onclick="nota('${o.id}')">Salvar</button></div>
   ${bts?`<div class="bts">${bts}</div>`:''}</div>`;
}
async function marcar(id,st,obs){calar();const r=await sb.rpc('parceiro_marcar',{p_id:id,p_st:st,p_nota:null,p_obs:obs??null});if(r.error)return toast(r.error.message);toast({aceito:'Aceito. Separe os produtos.',pronto:'Avisamos a loja: pronto para buscar.',saiu:'Saída registrada.',entregue:'Entrega registrada.',falta:'A loja foi avisada.'}[st]||'Pronto.');carregar()}
async function nota(id){const v=($('#nf-'+id)||{}).value||'';const r=await sb.rpc('parceiro_marcar',{p_id:id,p_st:'nota',p_nota:v,p_obs:null});if(r.error)return toast(r.error.message);toast('Número da nota salvo.');carregar()}
function falta(id){const t=prompt('O que está faltando? (a loja vai ver esta mensagem)');if(t&&t.trim())marcar(id,'falta',t.trim())}
function repasses(){
  if(!G)return '<div class="card mu">Carregando…</div>';
  return `<div class="res"><div><small>Hoje</small><b>${R(G.hoje)}</b><small>${G.nHoje} pedido(s)</small></div><div><small>No mês</small><b>${R(G.mes)}</b><small>${G.nMes} pedido(s)</small></div><div class="sal"><small>A receber</small><b>${R(G.saldo)}</b><small>da loja</small></div></div>
  <p class="mu" style="text-align:center;font-size:13.5px;margin:0 0 6px">Vendido no total ${R(G.vendido)} · comissão da loja ${(+G.comissao).toLocaleString('pt-BR')}% · repasse ${R(G.repasse)} · já pago ${R(G.pago)}</p>
  <div class="card"><b>Vendas (últimos 31 dias)</b>${(G.vendas||[]).map(v=>`<div class="lin"><span>#${esc(String(v.id).slice(-4).toUpperCase())} · ${new Date(v.date).toLocaleDateString('pt-BR')}${v.nota?' · NF '+esc(v.nota):''}</span><b>${R(v.valor)}</b></div>`).join('')||'<p class="mu">Nenhuma venda ainda.</p>'}</div>
  <div class="card"><b>Pagamentos recebidos da loja</b>${(G.pagamentos||[]).map(p=>`<div class="lin"><span>${new Date(p.data).toLocaleDateString('pt-BR')}${p.obs?' · '+esc(p.obs):''}</span><b class="mu">${R(p.valor)}</b></div>`).join('')||'<p class="mu">Nenhum pagamento ainda.</p>'}</div>`;
}
function desenhar(){
  ['t1','t2','t3'].forEach((t,i)=>$('#'+t).classList.toggle('on',['fila','feitos','rep'][i]==aba));
  if(aba=='rep'){$('#m').innerHTML=repasses();return}
  const l=aba=='fila'?L.filter(o=>o.st=='conf'):L.filter(o=>o.st!='conf');
  $('#m').innerHTML=l.length?l.map(card).join(''):`<div class="vazio"><div>${aba=='fila'?'☕':'📋'}</div><p class="mu">${aba=='fila'?'Nenhum pedido agora. Quando a loja aceitar um pedido com produtos seus, ele aparece aqui e toca o aviso.':'Nada concluído nas últimas horas.'}</p></div>`;
}
setInterval(()=>{if(!document.hidden)carregar()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)carregar()});
/* ===== instalar como app separado ===== */
const soloApp=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let pedidoInst=null;
function instDesenha(){
  const e=$('#inst');if(!e)return;if(soloApp()){e.innerHTML='';return}
  let fechado=false;try{fechado=localStorage.getItem('mo-parc-inst')==new Date().toDateString()}catch(x){}if(fechado){e.innerHTML='';return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  e.innerHTML=`<div class="inst"><img src="icon-192.png" alt=""><div><span class="t">Instale o app do Parceiro</span>${pedidoInst?'Fica com ícone próprio e avisa quando chegar pedido.':ios?'No Safari: toque em <b>Compartilhar</b> e em <b>Adicionar à Tela de Início</b>.':'No menu do navegador (⋮), toque em <b>Instalar app</b>.'}</div>${pedidoInst?'<button class="b" onclick="instalar()">Instalar</button>':''}<button class="b s" style="min-height:42px;padding:0 10px" aria-label="Fechar" onclick="try{localStorage.setItem(\'mo-parc-inst\',new Date().toDateString())}catch(x){};instDesenha()">✕</button></div>`;
}
async function instalar(){if(!pedidoInst)return;pedidoInst.prompt();await pedidoInst.userChoice.catch(()=>({}));pedidoInst=null;instDesenha()}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();pedidoInst=e;instDesenha()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});
instDesenha();iniciar();
</script></body></html>
